name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          prerelease: false
          generate_release_notes: true

  build:
    name: Build ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux binaries are statically linked against musl, so they run on any
          # distribution (old glibc versions, Alpine, distroless).
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact_name: zserv
            asset_name: zserv-linux-amd64
            extension: tar.gz
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            artifact_name: zserv
            asset_name: zserv-linux-arm64
            extension: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact_name: zserv
            asset_name: zserv-macos-amd64
            extension: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: zserv
            asset_name: zserv-macos-arm64
            extension: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: zserv.exe
            asset_name: zserv-windows-amd64.exe
            extension: zip

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: endsWith(matrix.target, '-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          # zstd's C sources need a musl C compiler; without this, cc looks for
          # aarch64-linux-musl-gcc, which Ubuntu does not ship.
          target=${{ matrix.target }}
          echo "CC_${target//-/_}=musl-gcc" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Smoke test
        # x86_64 macOS is cross-compiled on an Apple Silicon runner
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: target/${{ matrix.target }}/release/${{ matrix.artifact_name }} --version

      - name: Package
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} ${{ matrix.asset_name }}
          archive=${{ matrix.asset_name }}.${{ matrix.extension }}
          if [ "${{ matrix.extension }}" = zip ]; then
            7z a "$archive" ${{ matrix.asset_name }}
          else
            tar -czf "$archive" ${{ matrix.asset_name }}
          fi
          # Checked by `sha256sum -c`, and recorded in the npm package at publish time
          if command -v sha256sum >/dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          files: |
            ${{ matrix.asset_name }}.${{ matrix.extension }}
            ${{ matrix.asset_name }}.${{ matrix.extension }}.sha256
