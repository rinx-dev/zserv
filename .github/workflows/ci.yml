name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

  npm:
    name: npm launcher (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 18 is the minimum in npm/package.json "engines"
          - { os: ubuntu-latest, node: "18" }
          - { os: ubuntu-latest, node: "lts/*" }
          - { os: macos-latest, node: "lts/*" }
          - { os: windows-latest, node: "lts/*" }
    defaults:
      run:
        working-directory: npm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Test
        run: npm test

      # A CRLF "#!/usr/bin/env node" line breaks the zserv command on Linux and macOS
      - name: Check the packed launcher has LF line endings
        shell: bash
        run: |
          npm pack --silent
          tar -xzf zserv-*.tgz
          if grep -rl $'\r' package/bin package/lib; then
            echo "::error::CRLF line endings in the npm package"
            exit 1
          fi
