[package]
name = "zserv"
version = "0.2.1"
edition = "2024"
description = "A simple, lightweight, and modern HTTP file server."
authors = ["Rindog <hello@rinx.dev>"]
repository = "https://github.com/rinx-dev/zserv"
license = "MIT"
readme = "README.md"
keywords = ["http", "server", "static", "file-server", "cli"]
categories = ["web-programming::http-server", "command-line-utilities"]
# Only ship what `cargo install` needs; keeps npm/, CI config, and stray files out of the crate.
include = ["/src", "/README.md", "/LICENSE"]

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["http2"] }
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
colored = "3.1.1"
humansize = "2.1.3"
local-ip-address = "0.6.13"
percent-encoding = "2.3.2"
tokio = { version = "1.53.1", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["fs", "cors", "compression-full", "timeout", "set-header"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
strip = true
lto = true
codegen-units = 1
